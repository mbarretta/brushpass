name: Deploy

on:
  push:
    branches: [main]
    # Skip pushes that can't change the running image (infra/docs/CI only).
    paths-ignore:
      - "terraform/**"
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:

# Serialize deploys; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Deploys only when the target is configured as repo variables
    # (Settings → Secrets and variables → Actions → Variables). Without
    # GCP_PROJECT_ID the job is skipped, so forks and unconfigured repos never
    # attempt a deploy. Values come from the Terraform outputs (README Step 0b).
    if: vars.GCP_PROJECT_ID != ''

    permissions:
      contents: read
      id-token: write # federate OIDC token to GCP (WIF)

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'fileshare' }}
      IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO || 'cloud-run-source-deploy' }}/${{ vars.CLOUD_RUN_SERVICE || 'fileshare' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Federate the workflow OIDC token and impersonate github-deployer. No key.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Build linux/amd64, tagging both :latest (tracks Terraform's container_image)
      # and the commit SHA (immutable, for traceability and rollback).
      - name: Build and push image
        run: |
          docker build \
            --build-arg COMMIT_SHA="${GITHUB_SHA::7}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet
          echo "Deployed ${SERVICE} @ ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
