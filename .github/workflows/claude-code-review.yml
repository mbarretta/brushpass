name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1.0.195
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # digestabot PRs are authored by octo-sts[bot]; allow it so the
          # review runs instead of aborting on the non-human actor guard.
          allowed_bots: 'octo-sts[bot]'
          # Inline prompt instead of the anthropics/claude-code plugin
          # marketplace. `plugin_marketplaces` clones an arbitrary git ref of
          # that repo at run time with no commit pin — the only unpinnable
          # remote-code fetch anywhere in this repo's CI, in a job that holds
          # ANTHROPIC_API_KEY. This prompt reproduces the review's scope
          # in-repo so nothing unpinned is fetched.
          prompt: |
            Review pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Cover: correctness bugs and edge cases; security issues (injection,
            secret handling, authn/authz, unsafe deserialization); missing or
            inadequate tests for the changed behavior; dead code, needless
            complexity, and deviations from existing patterns elsewhere in this
            codebase. Post the findings as a PR review comment. Do not modify
            any files.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

