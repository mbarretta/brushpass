name: CI

on:
  pull_request:

# Least-privilege default; docker-build declares its own elevated block below.
permissions:
  contents: read

# Cancel a superseded run on the same PR rather than queuing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # assume CHAINCTL_IDENTITY to pull cgr.dev base images

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Registers a docker credential helper for cgr.dev so the build can pull
      # the private barretta/node base images pinned in the Dockerfile.
      - uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINCTL_IDENTITY }}

      # Builds the full multi-stage image. This is the meaningful gate for
      # digestabot PRs: it fails if a new base-image digest can't be pulled or
      # breaks the build, and it also runs `npm ci` + `next build` internally.
      - name: Build image
        run: docker build -t brushpass:ci .

  test:
    name: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # LTS with a better-sqlite3 prebuild; avoids a from-source compile

      - run: npm ci

      # Same placeholder value as the Dockerfile's build-time env (Dockerfile:12)
      # so a future test that forgets to mock @/lib/gcs fails on an assertion,
      # not a module-load throw (src/lib/gcs.ts:5 throws when GCS_BUCKET is unset).
      - name: Run tests
        env:
          GCS_BUCKET: build-placeholder
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # LTS with a better-sqlite3 prebuild; avoids a from-source compile

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` writes next-env.d.ts and .next/types, which tsconfig.json's
      # `include` references; both are gitignored, so a fresh checkout needs them
      # generated before a bare `tsc --noEmit` typechecks cleanly.
      - name: Typecheck
        run: npm run typecheck
